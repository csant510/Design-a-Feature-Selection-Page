<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selection Feature Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Feature Selection</h1>
    <div class="feature-card-container">
        <div class="feature-card">
            <label class="feature-card" for="Cloud Storage">Cloud Storage <input type="checkbox" id="Cloud Storage" /></label>
            <p>100 Gigabyte secure storage</p>
         </div>
        <div class="feature-card">
            <label class="feature-card" for="Dedicated Support">Dedicated Support <input type="checkbox" id="Dedicated Support" /></label>
            <p>24/7 customer help</p>
        </div>
        <div class="feature-card">
            <label class="feature-card" for="Advanced Analytics">Advanced Analytics <input type="checkbox" id="Advanced Analytics" /></label>
            <p>Insights & reports</p>
        </div>
         <div class="feature-card">
            <label class="feature-card" for="Multi-User Collab">Multi-User Collab <input type="checkbox" id="Custom User Themes" /></label>
            <p>Personalized dashboard design</p>
        </div>
           <div class="feature-card">
            <label class="feature-card" for="Multi-User Collab">Multi-User Collab <input type="checkbox" id="Multi-User Collab" /></label>
            <p>Team access and sharing</p>
        </div>
           <div class="feature-card">
            <label class="feature-card" for="API Access">API Access <input type="checkbox" id="API Access" /></label>
            <p>Integrate with your custom built tools</p>
        </div>

    </div>
</body>
</html>
